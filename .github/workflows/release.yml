name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.4.0)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Sign & Publish macOS Release
    runs-on: macos-15

    steps:
      - name: Resolve and validate release tag
        id: resolve_tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG_NAME="$INPUT_TAG"
          else
            TAG_NAME="$REF_NAME"
          fi
          if [[ ! "$TAG_NAME" =~ ^v[0-9][0-9A-Za-z._-]*$ ]]; then
            echo "ERROR: Invalid release tag '$TAG_NAME' (expected format like v0.4.0)" >&2
            exit 1
          fi
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.resolve_tag.outputs.tag }}
          fetch-depth: 0

      - name: Verify checked-out commit matches release tag
        env:
          TAG_NAME: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          TAG_COMMIT="$(git rev-parse --verify "refs/tags/${TAG_NAME}^{commit}")"
          HEAD_COMMIT="$(git rev-parse --verify HEAD)"
          if [[ "$HEAD_COMMIT" != "$TAG_COMMIT" ]]; then
            echo "ERROR: Checked-out HEAD ($HEAD_COMMIT) does not match tag ${TAG_NAME} ($TAG_COMMIT)" >&2
            exit 1
          fi
          echo "Verified HEAD matches tag ${TAG_NAME} (${HEAD_COMMIT})"

      - name: Import Developer ID certificate (optional)
        env:
          CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "$CERT_P12" || -z "$CERT_PASSWORD" ]]; then
            echo "Developer ID certificate secrets not configured; skipping certificate import."
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/mailpilot-signing.keychain-db"
          KC_PASS="${KEYCHAIN_PASSWORD:-mailpilot-ci-keychain}"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN_PATH"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build, test, and package release artifact
        env:
          APP_VERSION: ${{ steps.resolve_tag.outputs.version }}
          CODESIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: ./scripts/release_app.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.resolve_tag.outputs.tag }}
          APP_VERSION: ${{ steps.resolve_tag.outputs.version }}
        run: |
          ZIP_FILE="dist/MailPilot-${APP_VERSION}-macos-arm64.zip"
          SHA_FILE="${ZIP_FILE}.sha256"
          if [[ ! -f "$ZIP_FILE" || ! -f "$SHA_FILE" ]]; then
            echo "ERROR: Expected release artifacts missing: $ZIP_FILE / $SHA_FILE" >&2
            exit 1
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$ZIP_FILE" "$SHA_FILE" --clobber
          else
            gh release create "$TAG_NAME" "$ZIP_FILE" "$SHA_FILE" \
              --verify-tag \
              --title "MailPilot ${TAG_NAME}" \
              --generate-notes
          fi
